<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1B1F3B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ito">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Klee+One:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1F3B;
    --bg-soft:#262B52;
    --bg-soft2:#30356a;
    --card:#F7EFE3;
    --card-edge:#E4D7BE;
    --ink:#2B2440;
    --ink-soft:#5b5470;
    --thread:#E8714A;
    --thread-dark:#c75a36;
    --mustard:#E8B339;
    --good:#5C9C72;
    --bad:#C75450;
    --muted:#9893B5;
    --white:#fffaf2;
    --display:'Zen Maru Gothic', sans-serif;
    --hand:'Klee One', cursive;
    --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(255,255,255,0.06) 0, transparent 2.5%),
      radial-gradient(circle at 75% 18%, rgba(255,255,255,0.05) 0, transparent 2%),
      radial-gradient(circle at 40% 30%, rgba(255,255,255,0.04) 0, transparent 1.8%),
      radial-gradient(circle at 90% 60%, rgba(255,255,255,0.05) 0, transparent 2%),
      radial-gradient(circle at 25% 75%, rgba(255,255,255,0.04) 0, transparent 1.8%),
      radial-gradient(circle at 60% 90%, rgba(255,255,255,0.05) 0, transparent 2%),
      linear-gradient(160deg, var(--bg) 0%, var(--bg-soft2) 100%);
    background-attachment:fixed;
    font-family:var(--display);
    color:var(--white);
    min-height:100vh;
    min-height:100dvh;
    -webkit-tap-highlight-color:transparent;
  }
  *:focus-visible{outline:2px solid var(--mustard); outline-offset:2px;}
  .shell{max-width:480px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .topbar-right{display:flex;align-items:center;gap:2px;}
  .brand{font-weight:900;font-size:22px;letter-spacing:0.5px;display:flex;align-items:center;gap:8px;}
  .brand.brand-btn{background:none;border:0;color:var(--white);font-family:var(--display);font-size:28px;cursor:pointer;padding:4px 14px 4px 0;min-height:44px;-webkit-appearance:none;appearance:none;}
  .brand.brand-btn:active{opacity:.7;}
  .topbar-right .linkbtn{font-size:18px;font-weight:700;padding:10px 12px;min-height:44px;min-width:44px;}
  .topbar-right .home-btn{color:#d8d4ee;}
  .topbar-right .icon-btn{font-size:28px;line-height:1;position:relative;padding:8px 10px;}
  .mus-btn.off{opacity:.5;}
  .mus-btn.off::after{content:'';position:absolute;left:16%;right:16%;top:50%;height:3px;border-radius:2px;background:var(--white);transform:rotate(-40deg);}
  .music-panel{position:fixed;z-index:40;min-width:252px;background:var(--card);color:var(--ink);border:1px solid var(--card-edge);border-radius:16px;padding:14px 16px;box-shadow:0 14px 36px rgba(0,0,0,0.45);}
  .mp-row{display:flex;align-items:center;gap:12px;}
  .mp-row + .mp-row{margin-top:12px;}
  .mp-title{flex:1;font-weight:900;font-size:16px;}
  .mp-switch{border:0;border-radius:999px;padding:8px 16px;min-width:64px;font-family:var(--display);font-weight:900;font-size:14px;cursor:pointer;background:#d9cfb8;color:var(--ink-soft);}
  .mp-switch.on{background:var(--mustard);color:var(--ink);}
  .mp-label{font-size:13px;font-weight:700;color:var(--ink-soft);}
  .music-panel input[type=range]{flex:1;min-width:0;height:28px;accent-color:var(--thread);}
  .mp-num{min-width:30px;text-align:right;font-family:var(--mono);font-weight:700;font-size:13px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(10,12,30,0.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-card{background:var(--card);color:var(--ink);border-radius:18px;padding:24px 22px 20px;max-width:360px;width:100%;box-shadow:0 18px 44px rgba(0,0,0,0.5);border:1px solid var(--card-edge);}
  .modal-card h2{margin:0 0 8px;font-size:20px;}
  .modal-card p{margin:0 0 18px;font-size:14px;color:var(--ink-soft);line-height:1.6;}
  .more-link{display:inline-block;margin-top:6px;padding:8px 10px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:13px;}
  .more-link:hover{color:var(--white);}
  .linkbtn{background:none;border:none;color:var(--muted);font-family:var(--display);font-size:13px;cursor:pointer;padding:6px 8px;border-radius:8px;}
  .linkbtn:hover{color:var(--white);background:rgba(255,255,255,0.06);}
  h1{font-size:clamp(17px,4.5vw,26px);margin:8px 0 4px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  h2{font-size:19px;margin:0 0 10px;font-weight:700;}
  p.subtitle{color:var(--muted);font-size:14px;margin:0 0 22px;line-height:1.7;}
  .card{
    background:var(--card);
    color:var(--ink);
    border-radius:16px;
    padding:18px 18px;
    box-shadow:0 10px 26px rgba(0,0,0,0.28);
    border:1px solid var(--card-edge);
    margin-bottom:14px;
  }
  .field{margin-bottom:14px;}
  .label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;font-weight:700;}
  .input{
    width:100%;
    padding:12px 13px;
    border-radius:10px;
    border:1.5px solid var(--card-edge);
    background:var(--white);
    color:var(--ink);
    font-family:var(--display);
    font-size:15px;
  }
  .input:focus{border-color:var(--thread);}
  .input.mono{font-family:var(--mono);letter-spacing:2px;text-transform:uppercase;}
  textarea.input{resize:none;font-family:var(--hand);font-size:17px;min-height:54px;}
  .btn-home{padding:16px 18px;font-size:17px;border-radius:14px;}
  .home-logo{display:flex;justify-content:center;width:100%;padding:clamp(8px,2vh,22px) 4px clamp(18px,3.5vh,34px);background:none;border:0;border-radius:18px;cursor:pointer;font:inherit;color:inherit;-webkit-appearance:none;appearance:none;}
  .home-logo img{transition:transform .15s ease;}
  .home-logo:active img{transform:scale(0.96);}
  .home-logo img{height:clamp(190px,32vh,310px);width:auto;max-width:100%;object-fit:contain;display:block;filter:drop-shadow(0 14px 22px rgba(0,0,0,0.45));}
  .home-main{display:flex;flex-direction:column;gap:16px;}
  .btn.home-big{flex-direction:column;gap:6px;min-height:clamp(100px,16vh,136px);font-size:clamp(22px,6.4vw,28px);border-radius:22px;}
  .home-big .home-ico{font-size:clamp(28px,7.5vw,36px);line-height:1;}
  .home-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
  .btn.home-small{min-height:72px;font-size:15px;border-radius:16px;padding:12px 10px;text-align:center;line-height:1.35;}
  .cf .label{margin-top:14px;}
  .cf .label:first-child{margin-top:0;}
  .end-row{display:flex;gap:8px;align-items:center;}
  .end-chip{flex:0 0 auto;min-width:66px;text-align:center;font-family:var(--mono);font-weight:700;font-size:15px;color:var(--ink);background:#eadfc6;border-radius:10px;padding:12px 8px;}
  .end-row .input{flex:1;min-width:0;}
  .cf .checkbox-row{margin-top:14px;}
  .cf .error{margin:14px 0 0;}
  .cf .btn{margin-top:14px;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    border:none;border-radius:12px;padding:13px 18px;font-family:var(--display);
    font-weight:700;font-size:15px;cursor:pointer;width:100%;
    transition:transform 0.08s ease, box-shadow 0.08s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn:disabled{opacity:0.45;cursor:not-allowed;}
  .btn-primary{background:var(--mustard);color:#2B2440;box-shadow:0 4px 0 #b8862099;}
  .btn-secondary{background:var(--thread);color:var(--white);box-shadow:0 4px 0 #9c4a2c99;}
  .btn-ghost{background:rgba(255,255,255,0.08);color:var(--white);}
  .btn-ghost-oncard{background:var(--white);color:var(--ink);border:1.5px solid var(--card-edge);}
  .btn-sm{width:auto;padding:8px 12px;font-size:13px;border-radius:9px;}
  .btn-row{display:flex;gap:10px;}
  .btn-row .btn{flex:1;}
  .stack{display:flex;flex-direction:column;gap:10px;}
  .helper{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.6;}
  .error{font-size:13px;color:#ffb4ad;background:rgba(199,84,80,0.18);border:1px solid rgba(199,84,80,0.4);padding:10px 12px;border-radius:10px;margin-bottom:14px;}
  .room-code{
    font-family:var(--mono);font-weight:700;font-size:34px;letter-spacing:6px;text-align:center;
    background:var(--white);color:var(--ink);border-radius:12px;padding:14px 0;border:2px dashed var(--thread);
  }
  .topic-chip-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .topic-chip{
    background:var(--white);border:1.5px solid var(--card-edge);border-radius:10px;padding:10px 10px;
    font-size:13px;text-align:left;cursor:pointer;color:var(--ink);font-family:var(--display);
  }
  .topic-chip small{display:block;color:var(--ink-soft);font-size:11px;margin-top:3px;}
  .topic-chip.selected{border-color:var(--thread);border-width:2.5px;background:#fff3ea;font-weight:700;box-shadow:0 0 0 3px rgba(232,113,74,0.22);}
  .topic-chip.selected::after{content:'✓';float:right;color:var(--thread);font-weight:900;}
  .seg{display:flex;background:rgba(255,255,255,0.08);border-radius:11px;padding:4px;gap:4px;margin-bottom:10px;}
  .seg button{flex:1;border:none;background:transparent;color:var(--muted);padding:8px 2px;border-radius:8px;font-family:var(--display);font-size:11.5px;font-weight:700;cursor:pointer;}
  .seg button.active{background:var(--mustard);color:#2B2440;}
  .player-list{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;}
  .player-chip{background:rgba(255,255,255,0.09);border-radius:20px;padding:7px 13px;font-size:13px;display:flex;align-items:center;gap:6px;}
  .player-chip .host-star{color:var(--mustard);}
  .topic-banner{
    background:linear-gradient(135deg, var(--mustard), #f2c862);
    color:#2B2440;border-radius:14px;padding:14px 16px;margin-bottom:14px;text-align:center;
  }
  .topic-banner .ttext{font-size:18px;font-weight:900;}
  .topic-banner .scale-rows{display:flex;flex-direction:column;gap:6px;margin-top:12px;text-align:left;}
  .topic-banner .scale-row{display:flex;align-items:baseline;gap:10px;color:#3d2f10;font-weight:700;font-size:16px;}
  .topic-banner .scale-num{flex:0 0 auto;min-width:58px;font-family:var(--mono);font-weight:700;color:#2B2440;}
  .topic-banner .scale-txt{flex:1;line-height:1.35;}
  .number-stage{text-align:center;padding:26px 0 10px;}
  .number-stage .lab{font-size:13px;color:var(--ink-soft);margin-bottom:6px;}
  .number-btn{display:block;width:100%;font:inherit;color:var(--ink);cursor:pointer;-webkit-appearance:none;appearance:none;padding:26px 0 18px;}
  .number-btn:active{transform:scale(0.985);}
  .number-hidden{color:var(--ink-soft);letter-spacing:6px;animation:none;opacity:0.55;}
  .num-hint{margin-top:6px;font-size:13px;font-weight:700;color:var(--ink-soft);}
  .number-display{
    font-family:var(--mono);font-weight:700;font-size:64px;color:var(--ink);
    animation:popin 0.35s ease;
  }
  @keyframes popin{from{transform:scale(0.6);opacity:0;}to{transform:scale(1);opacity:1;}}
  .round-pill{display:inline-block;background:rgba(255,255,255,0.1);border-radius:20px;padding:5px 13px;font-size:12px;color:var(--muted);margin-bottom:10px;}
  .history-dots{display:flex;gap:5px;margin-bottom:10px;}
  .history-dots span{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .reveal-progress{text-align:center;font-weight:900;font-size:18px;color:var(--mustard);padding:16px 0 12px;}
  .ocnum-hidden{font-family:var(--display);font-size:15px;font-weight:700;color:var(--ink-soft);opacity:.7;}
  .order-card.static{animation:none;}
  .order-card.tap-next{cursor:pointer;outline:3px solid var(--mustard);outline-offset:2px;}
  @media (prefers-reduced-motion: no-preference){
    .flip-in{display:inline-block;animation:flipin .5s ease;}
    .order-card.tap-next{animation:pulsecard 1.4s ease-in-out infinite;}
  }
  @keyframes flipin{from{transform:rotateX(90deg) scale(.6);opacity:0;}to{transform:none;opacity:1;}}
  @keyframes pulsecard{0%,100%{outline-color:var(--mustard);}50%{outline-color:rgba(232,179,57,0.3);}}
  .order-anchor{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 22px 8px 34px;font-size:18px;font-weight:900;color:var(--white);}
  .order-anchor .anchor-end{font-size:15px;font-weight:700;color:#cfcbe6;text-align:right;}
  .order-anchor-top{border-bottom:1px dashed rgba(255,255,255,0.08);margin-bottom:6px;padding-bottom:8px;}
  .order-anchor-bottom{border-top:1px dashed rgba(255,255,255,0.08);margin-top:-4px;padding-top:8px;margin-bottom:14px;}
  .thread-wrap{position:relative;padding-left:22px;margin-top:6px;}
  .thread-wrap::before{content:'';position:absolute;left:7px;top:6px;bottom:6px;width:3px;background:repeating-linear-gradient(to bottom, var(--thread) 0 8px, transparent 8px 14px);border-radius:3px;}
  .order-card{
    position:relative;background:var(--card);border:1px solid var(--card-edge);border-radius:13px;
    padding:12px 14px 12px 16px;margin-bottom:18px;box-shadow:0 6px 14px rgba(0,0,0,0.22);
  }
  .order-card:nth-child(odd){transform:rotate(-0.6deg);}
  .order-card:nth-child(even){transform:rotate(0.6deg);}
  .order-card::before{
    content:'';position:absolute;left:-22px;top:14px;width:13px;height:13px;border-radius:50%;
    background:var(--thread-dark);box-shadow:0 0 0 3px var(--bg-soft2);
  }
  .order-card .ocname{font-weight:700;font-size:13px;color:var(--ink-soft);display:flex;align-items:center;justify-content:space-between;}
  .order-card .occlue{font-family:var(--hand);font-size:19px;color:var(--ink);margin-top:4px;min-height:24px;}
  .order-card .ocnum{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--thread-dark);margin-top:4px;}
  .order-controls{display:flex;flex-direction:column;gap:4px;}
  .order-controls button{
    width:30px;height:26px;border-radius:7px;border:none;background:rgba(43,36,64,0.08);
    color:var(--ink);font-size:13px;cursor:pointer;
  }
  .order-controls button:disabled{opacity:0.25;}
  .oc-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .connector{display:flex;align-items:center;gap:6px;margin:-10px 0 8px 0;padding-left:22px;font-size:12px;color:var(--muted);}
  .connector.ok{color:var(--good);}
  .connector.bad{color:#ff9d96;}
  .result-banner{border-radius:14px;padding:18px;text-align:center;margin-bottom:16px;}
  .result-banner.success{background:linear-gradient(135deg,#5C9C72,#7fbf8f);color:#0f2c18;}
  .result-banner.fail{background:linear-gradient(135deg,#C75450,#e08a86);color:#321210;}
  .result-banner .big{font-size:22px;font-weight:900;}
  footer.note{margin-top:auto;padding-top:30px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.7;}
  .help-box{background:rgba(255,255,255,0.06);border-radius:12px;padding:14px 16px;margin-bottom:16px;font-size:13px;line-height:1.85;color:#dcd9ee;}
  .help-box ol{margin:6px 0 0;padding-left:20px;}
  .count-stepper{display:flex;align-items:center;gap:14px;justify-content:center;}
  .count-stepper button{width:38px;height:38px;border-radius:10px;border:none;background:var(--white);color:var(--ink);font-size:18px;font-weight:700;cursor:pointer;}
  .count-stepper .num{font-family:var(--mono);font-size:24px;font-weight:700;}
  .name-rows{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .copy-row{display:flex;gap:8px;align-items:center;margin-top:10px;}
  .lang-row{display:flex;gap:8px;margin-bottom:18px;}
  .lang-row button{flex:1;padding:10px;border-radius:10px;border:1.5px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:var(--white);font-family:var(--display);font-weight:700;font-size:14px;cursor:pointer;}
  .lang-row button.active{background:var(--mustard);color:#2B2440;border-color:var(--mustard);}
  .checkbox-row{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--ink-soft);margin:10px 0 4px;line-height:1.5;}
  .checkbox-row input{margin-top:3px;flex-shrink:0;}
  .bank-item{background:var(--card);border:1px solid var(--card-edge);border-radius:12px;padding:12px 14px;margin-bottom:10px;color:var(--ink);}
  .bank-item .bname{font-family:var(--hand);font-size:17px;}
  .bank-item .bscale{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .help-step{display:flex;gap:14px;align-items:flex-start;background:rgba(255,255,255,0.05);border-radius:14px;padding:14px;margin-bottom:10px;}
  .help-step-num{width:28px;height:28px;border-radius:50%;background:var(--thread);color:var(--white);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
  .help-step-title{font-weight:700;font-size:15px;margin-bottom:4px;}
  .help-step-desc{font-size:13px;color:#dcd9ee;line-height:1.7;}
  .help-tip-box{background:rgba(232,179,57,0.12);border:1px solid rgba(232,179,57,0.3);border-radius:14px;padding:14px 16px;margin-top:6px;}
  .help-tip-title{font-weight:700;font-size:14px;margin-bottom:8px;color:var(--mustard);}
  .help-tip-box ul{margin:0;padding-left:18px;font-size:13px;color:#dcd9ee;line-height:1.85;}
  .oath-card{background:#1a2044;border:2.5px solid var(--mustard);border-radius:16px;padding:20px 18px 14px;margin-top:18px;box-shadow:0 8px 24px rgba(0,0,0,0.35);}
  .oath-header{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
  .oath-logo{font-family:var(--hand);font-size:28px;font-weight:700;color:var(--mustard);letter-spacing:-1px;}
  .oath-title{font-size:14px;font-weight:700;color:var(--mustard);}
  .oath-list{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:14px;counter-reset:oath-counter;}
  .oath-list li{font-size:15px;font-weight:700;color:var(--white);line-height:1.6;padding-left:22px;position:relative;}
  .oath-list li::before{content:counter(oath-counter) '.';counter-increment:oath-counter;position:absolute;left:0;color:var(--mustard);font-weight:900;font-size:13px;}
  .pledge-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:40px;}
  .oath-card.oath-big{padding:26px 22px 18px;margin-top:0;}
  .oath-card.oath-big .oath-logo{font-size:36px;}
  .oath-card.oath-big .oath-title{font-size:16px;}
  .oath-card.oath-big .oath-list{gap:22px;margin-top:6px;}
  .oath-card.oath-big .oath-list li{font-size:18px;line-height:1.7;padding-left:28px;}
  .oath-card.oath-big .oath-list li::before{font-size:15px;}
  .oath-note{font-size:11px;color:rgba(255,255,255,0.35);margin-top:14px;text-align:right;}
  .toast-ok{font-size:13px;color:#bfe8cc;background:rgba(92,156,114,0.18);border:1px solid rgba(92,156,114,0.4);padding:9px 12px;border-radius:10px;margin-bottom:12px;}
  @media (prefers-reduced-motion: no-preference){
    .order-card{animation:settle 0.3s ease;}
  }
  @keyframes settle{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>

function topicsFor(l){ return l==='en' ? PRESET_TOPICS_EN : PRESET_TOPICS_JA; }

/* ---------- utils ---------- */
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sampleNumbers(n){const pool=Array.from({length:100},(_,i)=>i+1);return shuffle(pool).slice(0,n);}
function pickRandomTopic(used,l){used=used||[];let pool=topicsFor(l).filter(t=>!used.includes(t.text));if(pool.length===0)pool=topicsFor(l);return pool[Math.floor(Math.random()*pool.length)];}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- custom topic form (shared by Browse Topics and the in-game Custom tab) ---------- */
const TOPIC_MAX = 50, END_MAX = 20;
const CUSTOM_EXAMPLES = {
  en:[
    ['Excuses for being late','Not believable','Very believable'],
    ['Ways to survive a Monday','Not helpful','Very helpful'],
    ['Pets with big personality','Low-key','Huge personality'],
    ['Picnic effort level','Very little effort','Huge effort'],
    ['Songs that get everyone singing','Nobody sings','Everybody sings'],
    ['Mystery items in the fridge','Not suspicious','Very suspicious'],
    ['Surprise party locations','Not surprising','Very surprising'],
    ['How dramatic a sneeze is','Not dramatic','Very dramatic']
  ],
  ja:[
    ['遅刻の言い訳','信じられない','完全に信じる'],
    ['月曜の朝を救うもの','役に立たない','とても役に立つ'],
    ['ペットの存在感','控えめ','存在感が大きい'],
    ['ピクニックの気合い','気合い少なめ','気合い十分'],
    ['カラオケで盛り上がる曲','盛り上がらない','めちゃくちゃ盛り上がる'],
    ['冷蔵庫の謎の物体','怪しくない','かなり怪しい'],
    ['夢に出てきたら驚く人','驚かない','とても驚く'],
    ['くしゃみの大きさ','小さい','大きい']
  ]
};
// One example set per language, picked once per page load so it doesn't flicker on re-render.
const customExampleIdx = {
  en: Math.floor(Math.random()*CUSTOM_EXAMPLES.en.length),
  ja: Math.floor(Math.random()*CUSTOM_EXAMPLES.ja.length)
};
function customExample(l){ const k = CUSTOM_EXAMPLES[l] ? l : 'en'; return CUSTOM_EXAMPLES[k][customExampleIdx[k]]; }
function customFormHTML(prefix, l, opts){
  const ex = customExample(l), d = draftOf(prefix);
  return `<div class="cf">
    <label class="label" for="${prefix}-text">${tl(l,'topicFieldLabel')}</label>
    <input id="${prefix}-text" class="input" maxlength="${TOPIC_MAX}" placeholder="${esc(ex[0])}" value="${esc(d.text)}" autocomplete="off">
    <label class="label" for="${prefix}-low">${tl(l,'lowEndLabel')}</label>
    <div class="end-row"><span class="end-chip">1 →</span><input id="${prefix}-low" class="input" maxlength="${END_MAX}" placeholder="${esc(ex[1])}" value="${esc(d.low)}" autocomplete="off"></div>
    <label class="label" for="${prefix}-high">${tl(l,'highEndLabel')}</label>
    <div class="end-row"><span class="end-chip">100 →</span><input id="${prefix}-high" class="input" maxlength="${END_MAX}" placeholder="${esc(ex[2])}" value="${esc(d.high)}" autocomplete="off"></div>
    ${opts.share ? `<label class="checkbox-row"><input type="checkbox" id="${prefix}-share"${d.share?' checked':''}>${tl(l,'shareToBankLabel')}</label>` : ''}
    <div class="error" id="${prefix}-err" style="display:none"></div>
    <button class="btn ${opts.btnClass}" onclick="${opts.onSubmit}()">${opts.label}</button>
  </div>`;
}
// Reads and validates the form. Shows an inline error (without re-rendering, so typed text is kept).
function readCustomForm(prefix){
  const text=(document.getElementById(prefix+'-text').value||'').trim().slice(0,TOPIC_MAX);
  const low=(document.getElementById(prefix+'-low').value||'').trim().slice(0,END_MAX);
  const high=(document.getElementById(prefix+'-high').value||'').trim().slice(0,END_MAX);
  Object.assign(draftOf(prefix),{text,low,high});
  const err=document.getElementById(prefix+'-err');
  let msg='';
  if(!text) msg=t('err_topicTextRequired');
  else if(!low || !high) msg=t('err_endsRequired');
  if(msg){ if(err){ err.textContent=msg; err.style.display='block'; } return null; }
  if(err) err.style.display='none';
  return {text, low, high};
}

function topbarHTML(showHome){
  const soundLabel = soundEnabled ? t('soundOnLabel') : t('soundOffLabel');
  const musicLabel = musicEnabled ? t('musicOnLabel') : t('musicOffLabel');
  const soundBtn = `<button class="linkbtn icon-btn snd-btn" onclick="toggleSound()" aria-label="${esc(soundLabel)}" title="${esc(soundLabel)}">${soundEnabled?'🔊':'🔇'}</button>`;
  const musicBtn = `<button class="linkbtn icon-btn mus-btn${musicEnabled?'':' off'}" onclick="toggleMusicPanel()" aria-label="${esc(musicLabel)}" title="${esc(musicLabel)}">🎵</button>`;
  const homeBtn = showHome ? `<button class="linkbtn home-btn" onclick="requestHome()">${t('homeLink')}</button>` : '';
  return `<div class="topbar"><button class="brand brand-btn" onclick="requestHome()" aria-label="${esc(t('homeLink'))}">ito</button><div class="topbar-right">${homeBtn}${musicBtn}${soundBtn}</div></div>`;
}
// Updates the sound/music buttons in place (no re-render, so a half-typed hint is never wiped).
function refreshTopbarButtons(){
  document.querySelectorAll('.snd-btn').forEach(b=>{
    const l = soundEnabled ? t('soundOnLabel') : t('soundOffLabel');
    b.textContent = soundEnabled ? '🔊' : '🔇'; b.setAttribute('aria-label', l); b.title = l;
  });
  document.querySelectorAll('.mus-btn').forEach(b=>{
    const l = musicEnabled ? t('musicOnLabel') : t('musicOffLabel');
    b.classList.toggle('off', !musicEnabled); b.setAttribute('aria-label', l); b.title = l;
  });
  const sw=document.getElementById('mp-switch');
  if(sw){ sw.classList.toggle('on', musicEnabled); sw.setAttribute('aria-checked', musicEnabled?'true':'false'); sw.textContent = musicEnabled ? t('musicSwitchOn') : t('musicSwitchOff'); }
}

/* ---------- global state ---------- */
let mode=null;            // null | 'online' | 'local' | 'bank'
let onlineStep='home';    // home | room
let myId=null, myName='';
let room=null;
let pendingRender=false;
let errorMsg='';
let showHelp=false;
let authReady=false;
let authError=false;
let lang='en';             // active language outside of an active room/local game (English by default)
try{ const savedLang=localStorage.getItem('ito_lang'); if(savedLang==='ja'||savedLang==='en') lang=savedLang; }catch(e){}

let local=null;            // {players, order, phase, round, topicMode, pendingTopic, topic, passIdx, history, lang}
let localStep='setup';     // setup | playing
let localCount=4;
let localNames=['','','','','','','',''];   // up to 8, kept even when players are removed so re-adding restores the name

/* ---------- keep what people typed across re-renders ----------
   Every screen redraw rebuilds the inputs, so typed text is saved first and put back after. */
const customDrafts = {};      // custom topic forms: prefix -> {text, low, high, share}
const typedFields = {};       // online name and room code fields
function draftOf(prefix){ return customDrafts[prefix] || (customDrafts[prefix]={text:'',low:'',high:'',share:false}); }
function clearCustomDraft(prefix){
  delete customDrafts[prefix];
  ['text','low','high'].forEach(k=>{ const el=document.getElementById(prefix+'-'+k); if(el) el.value=''; });
  const sh=document.getElementById(prefix+'-share'); if(sh) sh.checked=false;
}
function snapshotInputs(){
  ['ct','lct0','lct','bank'].forEach(px=>{
    const tx=document.getElementById(px+'-text'); if(!tx) return;
    const d=draftOf(px);
    d.text=tx.value; d.low=(document.getElementById(px+'-low')||{}).value||''; d.high=(document.getElementById(px+'-high')||{}).value||'';
    const sh=document.getElementById(px+'-share'); if(sh) d.share=sh.checked;
  });
  for(let i=0;i<8;i++){ const el=document.getElementById('ln-'+i); if(el) localNames[i]=el.value; }
  ['cr-name','jr-name','jr-code'].forEach(id=>{ const el=document.getElementById(id); if(el) typedFields[id]=el.value; });
}

function currentLang(){
  if(mode==='online' && room && room.lang) return room.lang;
  if(mode==='local' && local && local.lang) return local.lang;
  return lang;
}
function setLang(l){
  lang=l;
  try{ localStorage.setItem('ito_lang', l); }catch(e){}
  if(mode==='bank') attachBankListener(l);
  render();
}

/* ---------- auth ---------- */
function initAuth(){
  onAuthStateChanged(auth, (user)=>{
    if(user){
      myId = user.uid;
      authReady = true;
      render();
    } else {
      signInAnonymously(auth).catch((e)=>{
        console.error(e);
        authError = true;
        render();
      });
    }
  });
}

/* ---------- sound effects ----------
   All tones are synthesized in-browser via the Web Audio API, no audio
   files involved. Persisted mute preference lives in localStorage (safe
   here since this is a real deployed site, not a sandboxed artifact). */
let audioCtx = null;
let soundEnabled = true;
try{
  const saved = localStorage.getItem('ito_sound_enabled');
  if(saved !== null) soundEnabled = saved === '1';
}catch(e){ /* localStorage unavailable, default stays on */ }

function ensureAudioCtx(){
  if(!audioCtx){
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if(!Ctor) return null;
    try{ audioCtx = new Ctor(); }catch(e){ return null; }
  }
  if(audioCtx.state === 'suspended'){ audioCtx.resume().catch(()=>{}); }
  return audioCtx;
}
function toggleSound(){
  soundEnabled = !soundEnabled;
  try{ localStorage.setItem('ito_sound_enabled', soundEnabled ? '1' : '0'); }catch(e){}
  if(soundEnabled) ensureAudioCtx();

}
function playTone(freq, startOffset, duration, waveform, peakGain){
  if(!soundEnabled) return;
  const ctx = ensureAudioCtx();
  if(!ctx) return;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = waveform || 'sine';
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + startOffset;
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.linearRampToValueAtTime(peakGain || 0.16, t0 + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.03);
}
function playRoundStartSound(){
  playTone(523.25, 0,    0.16, 'sine', 0.14); // C5
  playTone(659.25, 0.09, 0.20, 'sine', 0.12); // E5
}
function playClickSound(){

  // Kept deliberately subtle since it fires very often.

}
function playSuccessSound(){
  playTone(523.25, 0,    0.18, 'triangle', 0.15); // C5
  playTone(659.25, 0.11, 0.18, 'triangle', 0.15); // E5
  playTone(783.99, 0.22, 0.18, 'triangle', 0.15); // G5
  playTone(1046.5, 0.34, 0.32, 'triangle', 0.17); // C6
}
function playFlipSound(ok){   // ok: null for the first card, true if connected, false if the order snapped
  if(ok===null) playTone(587.33,0,0.1,'sine',0.1);
  else if(ok){ playTone(659.25,0,0.1,'triangle',0.12); playTone(880,0.07,0.14,'triangle',0.12); }
  else playTone(233.08,0,0.22,'sawtooth',0.09);
}
function playFailSound(){
  playTone(392.00, 0,    0.22, 'sawtooth', 0.09); // G4

// One delegated listener covers every button in the app (all interactive
// elements here are real <button> tags), so this plays a soft confirmation
// tap on any press without needing to wire up dozens of individual calls.
// Buttons that already trigger a more distinct sound of their own (round
// start, success/fail) simply layer a quick tap before that sound, which
// reads as "press acknowledged, then payoff" rather than a glitchy repeat.
document.addEventListener('click', (e)=>{
  // Browsers only allow audio after a tap, so the first tap anywhere starts the music.
  musicUnlocked = true;

/* ---------- background music: "clever quiz night" ----------
   A bouncy 104 BPM groove synthesized with the Web Audio API (no audio files): marimba-style plucks
   with a few playful rising phrases, a walking bass, and a light shaker and woodblock.
   It has its own on/off switch and volume (tap the music button), starts after the first tap,
   and pauses while the tab is hidden. */
let musicEnabled = true;
try{ const sm = localStorage.getItem('ito_music_enabled'); if(sm !== null) musicEnabled = sm === '1'; }catch(e){}
let musicVolume = 50;   // 0 to 100, remembered between visits
try{ const sv = parseInt(localStorage.getItem('ito_music_volume'), 10); if(sv >= 0 && sv <= 100) musicVolume = sv; }catch(e){}
let musicUnlocked=false, musicPlaying=false, musicNodes=null, musicTimer=null, musicNextBar=0, musicBarIdx=0;
const MUSIC_BEAT = 60/104, MUSIC_BAR = MUSIC_BEAT*4, MUSIC_EIGHTH = MUSIC_BEAT/2, MUSIC_SWING = MUSIC_EIGHTH*0.14;
const MUSIC_MAX_GAIN = 2.78;   // gain at volume 100 (volume 60 would be 1.0, the default of 50 is a bit under)
const MUSIC_MIX = {mallet:0.10, bass:0.05, wood:0.04, shaker:0.035};   // relative loudness of each instrument
function musicTargetGain(){ const v=musicVolume/100; return MUSIC_MAX_GAIN*v*v; }
// 8-bar loop: C | Am | F | G | C | Em | F | G  (root note, third interval, marimba chord tones)
const MUSIC_BARS = [
  {root:48, third:4, tones:[72,76,79,84]}, {root:45, third:3, tones:[69,72,76,81]},
  {root:41, third:4, tones:[72,77,81,84]}, {root:43, third:4, tones:[74,79,83,86]},
  {root:48, third:4, tones:[72,76,79,84]}, {root:40, third:3, tones:[71,76,79,83]},
  {root:41, third:4, tones:[72,77,81,84]}, {root:43, third:4, tones:[74,79,83,86]}
];
const MUSIC_RUN_Q = [[0,79],[2,81],[3,83],[4,86],[6,88]];   // bar 4: a rising "question" that stays open
const MUSIC_RUN_A = [[0,79],[2,81],[3,83],[5,86],[7,83]];   // bar 8: the "answer" that leans back into the loop
const MUSIC_PAT_A = [[0,0],[1,1],[3,2],[4,1],[6,3]];         // [eighth-note step, chord tone index]
const MUSIC_PAT_B = [[0,2],[2,1],[3,0],[5,1],[6,2],[7,3]];
function midiHz(m){ return 440*Math.pow(2,(m-69)/12); }
function ensureMusicGraph(ctx){
  if(musicNodes) return musicNodes;
  const out=ctx.createGain(); out.gain.value=0;
  // melody bus: soft low-pass plus a tempo-synced echo
  const mel=ctx.createGain(); const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=4200; lp.Q.value=0.5;
  const delay=ctx.createDelay(1.0); delay.delayTime.value=MUSIC_BEAT*0.75;
  const fb=ctx.createGain(); fb.gain.value=0.28;
  const dlp=ctx.createBiquadFilter(); dlp.type='lowpass'; dlp.frequency.value=2600;
  const wet=ctx.createGain(); wet.gain.value=0.34;
  mel.connect(lp); lp.connect(out);
  lp.connect(delay); delay.connect(dlp); dlp.connect(fb); fb.connect(delay); dlp.connect(wet); wet.connect(out);
  // bass bus
  const bass=ctx.createGain(); const blp=ctx.createBiquadFilter(); blp.type='lowpass'; blp.frequency.value=1000;
  bass.connect(blp); blp.connect(out);
  // percussion bus (dry)
  const perc=ctx.createGain(); perc.connect(out);
  out.connect(ctx.destination);
  // short burst of noise reused for every shaker hit
  const sr=ctx.sampleRate||44100, len=Math.floor(sr*0.25);
  const noise=ctx.createBuffer(1,len,sr), d=noise.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  musicNodes={out,mel,bass,perc,noise,live:new Set()};
  return musicNodes;
}
function trackVoice(g,node){ g.live.add(node); node.onended=()=>{ g.live.delete(node); }; }
function voice(ctx,g,dest,type,freq,t0,dur,peak,attack){
  const osc=ctx.createOscillator(), env=ctx.createGain();
  osc.type=type; osc.frequency.value=freq;
  env.gain.setValueAtTime(0.0001,t0);
  env.gain.linearRampToValueAtTime(peak,t0+attack);
  env.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(env); env.connect(dest);
  osc.start(t0); osc.stop(t0+dur+0.03);
  trackVoice(g,osc);
}
function mallet(ctx,g,midi,t,vel){
  const f=midiHz(midi);
  voice(ctx,g,g.mel,'sine',f,t,0.34,MUSIC_MIX.mallet*vel,0.004);
  voice(ctx,g,g.mel,'sine',f*4,t,0.1,MUSIC_MIX.mallet*vel*0.22,0.002);
}
function woodblock(ctx,g,t,vel){
  voice(ctx,g,g.perc,'sine',1250,t,0.07,MUSIC_MIX.wood*vel,0.002);
  voice(ctx,g,g.perc,'triangle',1900,t,0.04,MUSIC_MIX.wood*vel*0.35,0.001);
}
function shaker(ctx,g,t,vel){
  const src=ctx.createBufferSource(), hp=ctx.createBiquadFilter(), env=ctx.createGain();
  src.buffer=g.noise; hp.type='highpass'; hp.frequency.value=6500;
  env.gain.setValueAtTime(0.0001,t);
  env.gain.linearRampToValueAtTime(MUSIC_MIX.shaker*vel,t+0.004);
  env.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  src.connect(hp); hp.connect(env); env.connect(g.perc);
  src.start(t,Math.random()*0.15); src.stop(t+0.07);
  trackVoice(g,src);
}
function scheduleMusicBar(ctx,g,idx,t0){
  const b=idx%MUSIC_BARS.length, bar=MUSIC_BARS[b], next=MUSIC_BARS[(b+1)%MUSIC_BARS.length];
  const at=(step)=>t0+step*MUSIC_EIGHTH+((step%2)?MUSIC_SWING:0);   // light swing on the off-beats
  // walking bass: root, third, fifth, then a half step below the next chord's root
  [[0,bar.root],[2,bar.root+bar.third],[4,bar.root+7],[6,next.root-1]].forEach(([st,m])=>{
    voice(ctx,g,g.bass,'triangle',midiHz(m),at(st),MUSIC_BEAT*0.9,MUSIC_MIX.bass,0.012);
  });
  // marimba: chord-tone patterns, with a rising phrase in bars 4 and 8
  let notes;
  if(b===3) notes=MUSIC_RUN_Q; else if(b===7) notes=MUSIC_RUN_A;
  else notes=(b%2===0?MUSIC_PAT_A:MUSIC_PAT_B).map(([st,ti])=>[st,bar.tones[ti]]);
  notes.forEach(([st,m],i)=>mallet(ctx,g,m,at(st),i===0?1:(st%2?0.7:0.9)));
  // woodblock backbeat and a light shaker on every eighth (off-beats a touch louder)
  [2,6].forEach(st=>woodblock(ctx,g,at(st),1));
  if(b%2===1) woodblock(ctx,g,at(7),0.5);
  for(let st=0;st<8;st++) shaker(ctx,g,at(st),st%2?1:0.55);
}
function startMusic(){
  if(!musicEnabled || musicPlaying) return;
  const ctx=ensureAudioCtx(); if(!ctx) return;
  const g=ensureMusicGraph(ctx);
  const now=ctx.currentTime;
  g.out.gain.cancelScheduledValues(now);
  g.out.gain.setValueAtTime(g.out.gain.value,now);
  g.out.gain.linearRampToValueAtTime(musicTargetGain(),now+1.5);
  musicPlaying=true; musicBarIdx=0; musicNextBar=now+0.1;
  const pump=()=>{ while(musicNextBar < ctx.currentTime+2.5){ scheduleMusicBar(ctx,g,musicBarIdx++,musicNextBar); musicNextBar+=MUSIC_BAR; } };
  pump(); musicTimer=setInterval(pump,500);
}
function stopMusic(){
  if(!musicPlaying) return;
  musicPlaying=false; clearInterval(musicTimer); musicTimer=null;
  if(!audioCtx || !musicNodes) return;
  const t=audioCtx.currentTime, g=musicNodes;
  g.out.gain.cancelScheduledValues(t);
  g.out.gain.setValueAtTime(g.out.gain.value,t);
  g.out.gain.linearRampToValueAtTime(0,t+0.5);
  g.live.forEach(o=>{ try{ o.stop(t+0.55); }catch(e){} });
  g.live.clear();
}
function applyMusicVolume(){
  if(!musicPlaying || !audioCtx || !musicNodes) return;
  const g=musicNodes.out.gain, t=audioCtx.currentTime;
  g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.setTargetAtTime(musicTargetGain(),t,0.05);
}
function toggleMusic(){
  musicEnabled=!musicEnabled;
  try{ localStorage.setItem('ito_music_enabled', musicEnabled ? '1' : '0'); }catch(e){}
  musicUnlocked=true;
  if(musicEnabled) startMusic(); else stopMusic();
  refreshTopbarButtons();
}
// Dragging the slider above 0 while the music is off turns it back on.
function setMusicVolume(v){
  musicVolume=Math.max(0,Math.min(100,Math.round(Number(v)||0)));
  try{ localStorage.setItem('ito_music_volume', String(musicVolume)); }catch(e){}
  const num=document.getElementById('mp-vol-num'); if(num) num.textContent=String(musicVolume);
  if(musicVolume>0 && !musicEnabled){
    musicEnabled=true; musicUnlocked=true;
    try{ localStorage.setItem('ito_music_enabled','1'); }catch(e){}
    startMusic(); refreshTopbarButtons();
  } else applyMusicVolume();
}
function musicPanelHTML(){

/* ---------- realtime sync helpers ---------- */
let syncError=false;
let busy=false;
let lastFailedAction=null;
let roomUnsub=null;
let lastKnownRoomPhase=null;
let lastKnownRevealed=null;

function isTyping(){const a=document.activeElement;return a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA');}
document.addEventListener('focusout', ()=>{ if(pendingRender){ pendingRender=false; render(); } });

function attachRoomListener(code){
  detachRoomListener();
  lastKnownRoomPhase = null; lastKnownRevealed = null;
  roomUnsub = onValue(roomRef(code), (snap)=>{
    const val = snap.val();
    if(!val) return;
    const prevPhase = lastKnownRoomPhase, prevRev = lastKnownRevealed;
    lastKnownRoomPhase = val.phase;
    const nOrder = (val.order||[]).length;
    lastKnownRevealed = val.phase==='reveal' ? revealedCount(val.revealed,nOrder) : null;
    // Only play transition sounds once we've seen a prior snapshot, so
    // joining/creating a room or refreshing the page doesn't trigger noise.
    if(prevPhase !== null){
      if(prevPhase !== 'clue' && val.phase === 'clue'){
        playRoundStartSound();
      } else if(val.phase === 'reveal'){
        const finale=()=>{ const ok = val.lastResult ? !!val.lastResult.success : orderIsCorrect(val.players,val.order); setTimeout(()=>{ if(ok) playSuccessSound(); else playFailSound(); },380); };
        if(prevPhase !== 'reveal'){
          if(lastKnownRevealed >= nOrder) finale();   // older room: everything was already face up
        } else if(prevRev !== null && lastKnownRevealed > prevRev){
          const k=lastKnownRevealed, o=val.order;
          playFlipSound(k<=1 ? null : val.players[o[k-2]].number < val.players[o[k-1]].number);
          if(k >= nOrder) finale();
        }
      }
    }
    room = val;
    if(isTyping()) pendingRender=true; else render();
  }, (err)=>{
    console.error(err);
    syncError = true;
    errorMsg = t('err_connFail');
    render();
  });
}
function detachRoomListener(){ if(roomUnsub){ roomUnsub(); roomUnsub=null; } lastKnownRoomPhase=null; lastKnownRevealed=null; }

async function safeWrite(writeFn){
  try{
    await writeFn();
    syncError=false; errorMsg=''; lastFailedAction=null;
    return true;
  }catch(e){
    console.error(e);
    syncError = true;
    lastFailedAction = ()=>safeWrite(writeFn);
    errorMsg = (e && e.code==='PERMISSION_DENIED') ? t('err_permissionDenied') : t('err_saveGeneric');
    render();
    return false;
  }
}
function retrySync(){ if(lastFailedAction) lastFailedAction(); }

async function createRoomAction(){

  busy=true; errorMsg=''; syncError=false; render();
  const name=(document.getElementById('cr-name').value||'').trim().slice(0,12) || (lang==='en' ? 'Player 1' : 'プレイヤー1');

      code=genCode();
      const snap=await get(roomRef(code));
      taken=snap.exists();
      tries++;
    }
  }catch(e){ code=genCode(); }
  const r={
    code, hostId:myId, phase:'lobby', topicMode:'presetRandom', pendingTopic:null, lang:lang,

    order:[], topic:null, round:0, usedTopics:[], lastResult:null, history:[]

  const l=currentLang();
  const f=readCustomForm('ct'); if(!f) return;
  if(Object.keys(room.players).length<2){ errorMsg=t('err_needTwoPlayers'); syncError=false; render(); return; }
  const share=!!(document.getElementById('ct-share')||{}).checked;
  if(share) safeWrite(()=>push(communityRef(l), {text:f.text, low:f.low, high:f.high, addedAt:Date.now()}));
  room.pendingTopic={text:f.text, low:f.low, high:f.high};
  clearCustomDraft('ct');
  hostStartRound();
}
function hostStartRound(){
  if(!isHost())return;
  const l=currentLang();
  const ids=Object.keys(room.players);
  if(ids.length<2){ errorMsg=t('err_needTwoPlayers'); syncError=false; render(); return; }
  let topic=room.pendingTopic;
  if(room.topicMode==='presetRandom' || !topic){
    topic=pickRandomTopic(room.usedTopics, l);
    room.usedTopics=(room.usedTopics||[]).concat([topic.text]);
  }
  const nums=sampleNumbers(ids.length);
  const updates={};
  shuffle(ids).forEach((id,i)=>{
    room.players[id].number=nums[i];
    room.players[id].clue='';
    room.players[id].submitted=false;
    updates['players/'+id+'/number']=nums[i];
    updates['players/'+id+'/clue']='';
    updates['players/'+id+'/submitted']=false;
  });
  room.topic=topic;
  room.pendingTopic=null;
  room.phase='clue';
  room.round=(room.round||0)+1;
  room.order=shuffle(ids);
  room.lastResult=null;
  Object.assign(updates, {topic, pendingTopic:null, phase:'clue', round:room.round, order:room.order, lastResult:null, usedTopics:room.usedTopics});
  errorMsg=''; render();
  safeWrite(()=>update(roomRef(room.code), updates));
}
function submitClueAction(){
  const text=(document.getElementById('clue-input').value||'').trim();
  room.players[myId].clue=text;
  room.players[myId].submitted=true;
  const activeIds = room.order || [];
  const all = activeIds.length>0 && activeIds.every(id=>room.players[id] && room.players[id].submitted);
  const updates={};
  updates['players/'+myId+'/clue']=text;
  updates['players/'+myId+'/submitted']=true;
  if(all){ room.phase='order'; updates.phase='order'; }
  render();
  safeWrite(()=>update(roomRef(room.code), updates));
}
function moveOrder(idx,dir){
  const o=room.order.slice();
  const j=idx+dir;
  if(j<0||j>=o.length)return;
  [o[idx],o[j]]=[o[j],o[idx]];
  room.order=o; render();
  safeWrite(()=>update(roomRef(room.code), {order:o}));
}
function hostReveal(){
  if(!isHost())return;
  room.phase='reveal'; room.revealed=0; room.lastResult=null;
  render();
  safeWrite(()=>update(roomRef(room.code), {phase:'reveal', revealed:0, lastResult:null}));
}
// Host flips the next card, from the lowest spot to the highest. Everyone sees it at the same time.
function hostRevealNext(){
  if(!isHost() || room.phase!=='reveal') return;
  const n=(room.order||[]).length, cur=revealedCount(room.revealed,n);
  if(cur>=n) return;
  const next=cur+1; room.revealed=next;
  const updates={revealed:next};
  if(next===n){
    const success=orderIsCorrect(room.players,room.order);
    room.lastResult={success}; room.history=(room.history||[]).concat([success]);
    updates.lastResult={success}; updates.history=room.history;
  }
  render();
  safeWrite(()=>update(roomRef(room.code), updates));
}
function hostNextRound(){
  if(!isHost())return;
  room.phase='lobby';
  room.lastResult=null; render();
  safeWrite(()=>update(roomRef(room.code), {phase:'lobby', lastResult:null, revealed:null}));
}
function copyCode(){
  const code=room.code;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(()=>{
      const el=document.getElementById('copy-status'); if(el) el.textContent=t('copiedText');
    }).catch(()=>{ const el=document.getElementById('copy-status'); if(el) el.textContent=t('copyFallbackText'); });
  }
}

function beginLocalRound(){
  const l=currentLang();
  const ids=Object.keys(local.players);
  let topic=local.pendingTopic;
  if(local.topicMode==='presetRandom' || !topic){

  local.topic=topic;

function localMoveOrder(idx,dir){

function localReveal(){
  local.phase='reveal'; local.revealed=0; local.lastResult=null;
  render();
}
function localRevealNext(){
  if(!local || local.phase!=='reveal') return;
  const o=local.order, n=o.length, cur=revealedCount(local.revealed,n);
  if(cur>=n) return;
  const next=cur+1; local.revealed=next;
  playFlipSound(next===1 ? null : local.players[o[next-2]].number < local.players[o[next-1]].number);
  if(next===n){
    const success=orderIsCorrect(local.players,o);
    local.lastResult={success}; local.history=(local.history||[]).concat([success]);
    setTimeout(()=>{ if(success) playSuccessSound(); else playFailSound(); },380);
  }
  render();
}

function renderHistoryDots(history){

function renderErrorBanner(){
  if(!errorMsg) return '';
  if(syncError){
    return `<div class="error">${esc(errorMsg)}
      <div style="margin-top:8px;"><button class="btn btn-secondary btn-sm" onclick="retrySync()">${t('retryBtn')}</button></div>

function topicBannerHTML(topic){
  return `<div class="topic-banner"><div class="ttext">${esc(topic.text)}</div>
    <div class="scale-rows">
      <div class="scale-row"><span class="scale-num">1 →</span><span class="scale-txt">${esc(topic.low)}</span></div>
      <div class="scale-row"><span class="scale-num">100 →</span><span class="scale-txt">${esc(topic.high)}</span></div>
    </div></div>`;
}

function orderIsCorrect(players, order){ return order.every((id,i)=> i===order.length-1 || players[id].number < players[order[i+1]].number); }
// How many cards are face up. A missing value (older rooms) means everything is already revealed.
function revealedCount(rev, n){ return (rev==null) ? n : Math.max(0, Math.min(n, rev)); }
function revealProgressText(a,b){ return currentLang()==='en' ? ('Revealed '+a+' of '+b) : (b+'枚中'+a+'枚めくりました'); }

function renderOrderAndReveal(playersObj, order, topic, phase, round, history, hostAllowed, cb, revealed){
  let html='';
  html += renderHistoryDots(history);
  html += `<div class="round-pill">${roundLabel(round)}</div>`;
  html += topicBannerHTML(topic);
  html += renderErrorBanner();

  if(phase==='order'){
    html += `<p class="subtitle">${t('orderInstructions')}</p>`;
    html += `<div class="order-anchor order-anchor-top">
      <span>${t('orderLowLabel')}</span>
      <span class="anchor-end">${esc(topic.low)}</span>
    </div>`;
    html += `<div class="thread-wrap">`;
    order.forEach((id,idx)=>{
      const p=playersObj[id];
      html += `<div class="order-card"><div class="oc-row">
        <div style="flex:1;">
          <div class="ocname"><span>${esc(p.name)}</span></div>
          <div class="occlue">${p.clue ? esc(p.clue) : '<span style=\"color:#a89; font-size:14px;\">'+t('noClueText')+'</span>'}</div>
        </div>
        <div class="order-controls">
          <button onclick="${cb.move}(${idx},-1)" ${idx===0?'disabled':''}>▲</button>
          <button onclick="${cb.move}(${idx},1)" ${idx===order.length-1?'disabled':''}>▼</button>
        </div>
      </div></div>`;
    });
    html += `</div>`;
    html += `<div class="order-anchor order-anchor-bottom">
      <span>${t('orderHighLabel')}</span>
      <span class="anchor-end">${esc(topic.high)}</span>
    </div>`;
    if(hostAllowed){
      html += `<button class="btn btn-primary" onclick="${cb.reveal}()">${t('judgeBtn')}</button>`;
    } else {
      html += `<div class="helper">${t('waitingHostJudgeText')}</div>`;
    }
  } else if(phase==='reveal'){
    const n=order.length, rev=revealedCount(revealed,n), done=rev>=n;
    if(done){
      const success=orderIsCorrect(playersObj,order);
      html += `<div class="result-banner ${success?'success':'fail'}"><div class="big">${success?t('successBannerText'):t('failBannerText')}</div></div>`;
    } else {
      html += `<div class="reveal-progress">${revealProgressText(rev,n)}</div>`;
    }
    html += `<div class="thread-wrap">`;
    order.forEach((id,idx)=>{
      const p=playersObj[id], shown=idx<rev, isNext=(idx===rev && !done && hostAllowed);
      const numHTML = shown
        ? `<span class="ocnum${idx===rev-1?' flip-in':''}">${p.number}</span>`
        : `<span class="ocnum ocnum-hidden">${isNext?t('tapToReveal'):'?'}</span>`;
      html += `<div class="order-card static${isNext?' tap-next':''}"${isNext?` onclick="${cb.revealNext}()"`:''}><div class="oc-row"><div style="flex:1;">
        <div class="ocname"><span>${esc(p.name)}</span>${numHTML}</div>
        <div class="occlue">${p.clue ? esc(p.clue) : ''}</div>
      </div></div></div>`;
      if(idx<n-1 && idx+1<rev){
        const ok = p.number < playersObj[order[idx+1]].number;
        html += `<div class="connector ${ok?'ok':'bad'}">${ok?t('connectorOkText'):t('connectorBadText')}</div>`;
      }
    });
    html += `</div>`;
    if(!done){
      if(hostAllowed) html += `<button class="btn btn-primary" onclick="${cb.revealNext}()">${t('revealNextBtn')}</button>`;
      else html += `<div class="helper">${t('waitingRevealText')}</div>`;
    } else if(hostAllowed){
      html += `<button class="btn btn-primary" onclick="${cb.next}()">${t('playAgainBtn')}</button>`;
      if(cb.changeTopic){
        html += `<button class="btn btn-ghost" style="margin-top:8px;" onclick="${cb.changeTopic}()">${t('changeTopicBtn')}</button>`;
      }
    } else {
      html += `<div class="helper">${t('waitingNextRoundText')}</div>`;
    }
  }
  return html;
}

    '並べ替えは全員で相談できる。どんどん意見を出して',
  ] : [
    'Share the feeling of your number. "It\'s moderate by my standards, but I have high tolerance" counts',
    'Vague responses make it more fun. Debate is part of the game',
    'The arrangement phase is fully collaborative. Everyone can and should weigh in',
  ];
  let html = `${topbarHTML(true)}`;
  html += `<div class="lang-row">
    <button class="${l==='ja'?'active':''}" onclick="setLang('ja')">日本語</button>
    <button class="${l==='en'?'active':''}" onclick="setLang('en')">English</button>
  </div>`;
  html += `<h2>${t('helpHeading')}</h2>`;
  /* ito name origin — shown as a small side note */
  const itoBlurb = l==='ja'
    ? `※「ito」は「糸」と「意図」の掛け言葉。それぞれの答えが一本の糸のようにつながっていくと同時に、相手がその表現を選んだ"意図"をどれだけ汲み取れるかが、このゲームの本当の面白さです。`
    : `* "Ito" is a play on two Japanese words: 糸 (thread) and 意図 (intent). Your responses connect like a single thread, but the real game is reading each other's intent, figuring out why someone chose the words they did.`;
  html += `<p style="font-size:12px;color:var(--muted);margin:0 0 16px;line-height:1.6;">${itoBlurb}</p>`;
  steps.forEach((s,i)=>{
    html += `<div class="help-step">
      <div class="help-step-num">${i+1}</div>
      <div class="help-step-body">
        <div class="help-step-title">${s.icon} ${esc(s.title)}</div>
        <div class="help-step-desc">${esc(s.body)}</div>
      </div>
    </div>`;
  });
  html += `<div class="help-tip-box"><div class="help-tip-title">💡 ${esc(tipTitle)}</div><ul>`;
  tips.forEach(tip=>{ html += `<li>${esc(tip)}</li>`; });
  html += `</ul></div>`;

  /* 3つの誓い card (shared with the pledges page) */
  html += oathCardHTML(l);

  html += `<div class="stack" style="margin-top:18px;">
    <button class="btn btn-primary" onclick="goOnlineHome()">📱 ${t('btnOnline')}</button>
    <button class="btn btn-secondary" onclick="goLocalSetup()">🔄 ${t('btnLocal')}</button>
  </div>`;
  return html;
}

function renderBankMode(){
  const l=currentLang();
  let html = `${topbarHTML(true)}`;
  html += `<div class="lang-row">
    <button class="${l==='ja'?'active':''}" onclick="setLang('ja')">日本語</button>
    <button class="${l==='en'?'active':''}" onclick="setLang('en')">English</button>
  </div>`;
  html += `<h2>${t('bankHeading')}</h2>`;
  html += `<p class="subtitle">${t('bankIntro')}</p>`;
  html += `<div class="card">
    <h2 style="font-size:15px;">${t('bankAddHeading')}</h2>
    ${renderErrorBanner()}
    ${bankJustAdded?'<div class="toast-ok">'+t('bankAddedText')+'</div>':''}
    ${customFormHTML('bank', l, {share:false, btnClass:'btn-primary', onSubmit:'bankAddTopic', label:t('bankAddBtn')})}
  </div>`;
  html += `<h2 style="font-size:15px;margin-top:18px;">${t('bankListHeading')}</h2>`;
  if(bankList.length===0){
    html += `<p class="subtitle">${t('bankEmptyText')}</p>`;
  } else {
    bankList.forEach(tp=>{
      html += `<div class="bank-item"><div class="bname">${esc(tp.text)}</div>
        <div class="bscale"><span>${esc(tp.low)}</span><span>${esc(tp.high)}</span></div></div>`;
    });
  }
  return html;
}

function renderOnlineMode(){
  let html = `${topbarHTML(true)}`;

  if(onlineStep==='home'){
    html += `<h2>${t('onlineHomeHeading')}</h2>`;
    html += `<p class="subtitle">${t('onlineHomeSubtitle')}</p>`;
    html += renderErrorBanner();
    html += `<div class="card">
      <div class="field"><label class="label">${t('yourNameLabel')}</label><input id="cr-name" class="input" maxlength="12" placeholder="${t('namePlaceholderHost')}" value="${esc(typedFields['cr-name']||'')}" ${busy?'disabled':''}></div>
      <button class="btn btn-primary" onclick="createRoomAction()" ${busy?'disabled':''}>${busy?t('creatingBtn'):t('createRoomBtn')}</button>
    </div>
    <div class="card">
      <div class="field"><label class="label">${t('roomCodeLabel')}</label><input id="jr-code" class="input mono" maxlength="4" placeholder="${t('codePlaceholder')}" value="${esc(typedFields['jr-code']||'')}" ${busy?'disabled':''}></div>
      <div class="field"><label class="label">${t('yourNameLabel')}</label><input id="jr-name" class="input" maxlength="12" placeholder="${t('namePlaceholderGuest')}" value="${esc(typedFields['jr-name']||'')}" ${busy?'disabled':''}></div>
      <button class="btn btn-secondary" onclick="joinRoomAction()" ${busy?'disabled':''}>${busy?t('joiningBtn'):t('joinRoomBtn')}</button>
    </div>`;
    return html;
  }

  if(!room){ return html + `<p class="subtitle">${t('loadingText')}</p>`; }
  const l=currentLang();

  if(room.phase==='lobby'){
    html += `<h2>${t('roomHeadingPrefix')} ${room.code}</h2>`;
    html += renderErrorBanner();
    html += `<div class="room-code">${room.code}</div>
      <div class="copy-row"><button class="btn btn-ghost btn-sm" onclick="copyCode()">${t('copyCodeBtn')}</button><span id="copy-status" class="helper"></span></div>`;
    html += `<div class="player-list">`;
    Object.values(room.players).forEach(p=>{
      html += `<div class="player-chip">${p===room.players[room.hostId]?'<span class=\"host-star\">★</span>':''}${esc(p.name)}</div>`;
    });
    html += `</div>`;
    if(isHost()){
      html += `<div class="card"><h2 style="font-size:15px;">${t('topicSectionHeading')}</h2>`;
      html += topicModeSelector({mode:room.topicMode, lang:l, onMode:'hostSetTopicMode', onPickPreset:'hostChoosePreset', onPickCommunity:'hostChooseCommunity', onSaveCustom:'hostStartCustom', idPrefix:'ct', selectedText: room.pendingTopic ? room.pendingTopic.text : null});
      if(room.pendingTopic && room.topicMode!=='custom'){
        html += `<div class="helper">${t('selectedTopicPrefix')} ${quoteWrap(esc(room.pendingTopic.text))}</div>`;
      }
      html += `</div>`;
      if(room.topicMode!=='custom') html += `<button class="btn btn-primary" onclick="hostStartRound()">${room.round>0?t('nextRoundBtn'):t('startRoundBtn')}</button>`;
    } else {
      html += `<p class="subtitle">${t('waitingHostTopicText')}</p>`;
    }
    return html;
  }

  if(room.phase==='clue'){
    const me=room.players[myId];
    const activeIds = room.order || [];
    const amActive = activeIds.includes(myId);
    html += renderHistoryDots(room.history);
    html += `<div class="round-pill">${roundLabel(room.round)}</div>`;
    html += topicBannerHTML(room.topic);
    if(!amActive){
      html += `<div class="card" style="text-align:center;padding:24px 18px;">
        <div style="font-size:32px;margin-bottom:10px;">👀</div>
        <p class="subtitle" style="margin:0;">${t('spectatorJoinedText')}</p>
      </div>`;
      return html;
    }
    html += `<div class="card number-stage"><div class="lab">${t('yourNumberLabel')}</div>
      <div class="number-display">${me.number}</div></div>`;
    html += renderErrorBanner();
    if(!me.submitted){
      html += `<div class="field"><label class="label">${t('clueLabel')}</label>
        <textarea id="clue-input" class="input" placeholder="${t('cluePlaceholder')}"></textarea></div>`;
      html += `<button class="btn btn-primary" onclick="submitClueAction()">${t('submitClueBtn')}</button>`;
    } else {
      html += `<p class="subtitle">${t('waitingOthersText')}</p>`;
    }
    const submittedCount = activeIds.filter(id=>room.players[id] && room.players[id].submitted).length;
    html += `<div class="helper">${submittedCountText(submittedCount, activeIds.length)}</div>`;
    return html;
  }

  if(room.phase==='order' || room.phase==='reveal'){
    const activeIds = room.order || [];
    if(!activeIds.includes(myId)){
      html += `<div class="helper" style="margin-bottom:10px;">👀 ${t('spectatorWatchingText')}</div>`;
    }
    html += renderOrderAndReveal(room.players, room.order, room.topic, room.phase, room.round, room.history, isHost(), {move:'moveOrder', reveal:'hostReveal', revealNext:'hostRevealNext', next:'hostNextRound'}, room.revealed);
    return html;
  }

  return html;
}

function renderLocalMode(){
  let html = `${topbarHTML(true)}`;

  if(localStep==='setup'){
    const l=currentLang();
    html += `<div class="lang-row">
      <button class="${lang==='ja'?'active':''}" onclick="setLang('ja')">日本語</button>
      <button class="${lang==='en'?'active':''}" onclick="setLang('en')">English</button>
    </div>`;
    html += `<h2>${t('localSetupHeading')}</h2>`;
    html += `<p class="subtitle">${t('localSetupSubtitle')}</p>`;
    html += `<div class="card">
      <label class="label">${t('playerCountLabel')}</label>
      <div class="count-stepper">
        <button onclick="setLocalCount(-1)">−</button>
        <span class="num">${localCount}</span>
        <button onclick="setLocalCount(1)">＋</button>
      </div>
      <div class="name-rows">`;
    for(let i=0;i<localCount;i++){
      html += `<input id="ln-${i}" class="input" maxlength="12" placeholder="${playerPlaceholder(i+1)}" value="${esc(localNames[i]||'')}">`;
    }
    html += `</div></div>`;
    html += `<div class="card"><h2 style="font-size:15px;">${t('topicSectionHeading')}</h2>`;
    html += topicModeSelector({mode:(local&&local.topicMode)||'presetRandom', lang:l, onMode:'localSetTopicModeBeforeStart', onPickPreset:'localChoosePresetBeforeStart', onPickCommunity:'localChooseCommunityBeforeStart', onSaveCustom:'localStartCustom', idPrefix:'lct0', selectedText: (local&&local.pendingTopic)?local.pendingTopic.text:null});
    const setupCustom = ((local&&local.topicMode)||'presetRandom')==='custom';
    if(local && local.pendingTopic && !setupCustom){
      html += `<div class="helper">${t('selectedTopicPrefix')} ${quoteWrap(esc(local.pendingTopic.text))}</div>`;
    }
    html += `</div>`;
    html += renderErrorBanner();
    if(!setupCustom) html += `<button class="btn btn-primary" onclick="startLocalGame()">${t('startLocalBtn')}</button>`;
    return html;
  }

  if(!local) return html;

  if(local.phase==='pass'){
    const ids=Object.keys(local.players);
    const id=ids[local.passIdx];
    const p=local.players[id];
    html += `<div class="round-pill">${roundLabel(local.round)}</div>`;
    html += `<div class="card" style="text-align:center;padding:34px 18px;">
      <div style="font-size:15px;color:var(--ink-soft);margin-bottom:10px;">${t('nextTurnLabel')}</div>
      <div style="font-size:23px;font-weight:900;margin-bottom:18px;">${esc(withHonorific(p.name))}</div>
      <p style="font-size:13px;color:var(--ink-soft);">${t('passInstructions')}</p>
      <button class="btn btn-secondary" style="margin-top:10px;" onclick="localRevealOwnNumber()">${t('revealNumberBtn')}</button>
    </div>`;
    return html;
  }

  if(local.phase==='pass-show'){
    const ids=Object.keys(local.players);
    const id=ids[local.passIdx];
    const p=local.players[id];
    html += topicBannerHTML(local.topic);
    html += `<button type="button" id="num-card" class="card number-stage number-btn" aria-pressed="${localNumberShown?'true':'false'}" onclick="toggleLocalNumber()"><div class="lab">${numberOfLabel(esc(p.name))}</div>
      <div class="num-body">${numberBodyHTML(p.number, localNumberShown)}</div></button>`;
    html += `<div class="field"><label class="label">${t('clueLabel')}</label>
      <textarea id="lc-input" class="input" placeholder="${t('cluePlaceholder')}"></textarea></div>`;
    html += `<button class="btn btn-primary" onclick="localSubmitClue()">${t('decideAndPassBtn')}</button>`;
    return html;
  }

  if(local.phase==='retopic'){
    const l=currentLang();
    html += `<h2>${t('retopicHeading')}</h2>`;
    html += `<div class="card">`;
    html += topicModeSelector({mode:local.topicMode, lang:l, onMode:'localSetTopicMode', onPickPreset:'localChoosePreset', onPickCommunity:'localChooseCommunity', onSaveCustom:'localSaveCustomTopic', idPrefix:'lct', selectedText: local.pendingTopic ? local.pendingTopic.text : null});
    html += `</div>`;
    html += renderErrorBanner();
    if(local.topicMode!=='custom'){
      html += `<button class="btn btn-primary" onclick="beginLocalRound();render();">${t('thisTopicStartBtn')}</button>`;
    }
    return html;
  }

  if(local.phase==='order' || local.phase==='reveal'){
    html += renderOrderAndReveal(local.players, local.order, local.topic, local.phase, local.round, local.history, true, {move:'localMoveOrder', reveal:'localReveal', revealNext:'localRevealNext', next:'localStartNextRound', changeTopic:'localGoTopicPick'}, local.revealed);
    return html;
  }

  return html;
}

/* ---------- expose handlers for inline HTML event attributes ----------
   (top-level functions in a module script are NOT auto-attached to window,
   unlike a classic script — so anything referenced from onclick="..." in
   the templates above must be explicitly exported here.) */
Object.assign(window, {
  setLang, goBank, goHelp, goPledge, toggleLocalNumber, requestHome, toggleMusic, toggleMusicPanel, setMusicVolume, closeLeaveConfirm, confirmLeave, bankAddTopic, communityShuffle, presetShuffle, toggleSound,
  beginLocalRound, copyCode, createRoomAction, goLocalSetup, goOnlineHome, goTitle,
  hostStartRound, joinRoomAction, localRevealOwnNumber, localSubmitClue, render,
  retrySync, setLocalCount, startLocalGame, submitClueAction, toggleHelp,
  moveOrder, hostReveal, hostRevealNext, hostNextRound, localMoveOrder, localReveal, localRevealNext, localStartNextRound, localGoTopicPick,
  hostSetTopicMode, hostChoosePreset, hostStartCustom, hostChooseCommunity,
  localSetTopicModeBeforeStart, localChoosePresetBeforeStart, localStartCustom, localChooseCommunityBeforeStart,
  localSetTopicMode, localChoosePreset, localSaveCustomTopic, localChooseCommunity
});

/* ---------- init ---------- */
render();
initAuth();
</script>
</body>
</html>
